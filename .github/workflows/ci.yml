name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-test-build:
    runs-on: ubuntu-latest
    env:
      CI: true
      # Matches the `services.postgres` block below. A development-scoped
      # credential for a database that exists only for the length of this job.
      DATABASE_URL: postgresql://parsianstore:parsianstore@localhost:5432/parsian_store?schema=public
    # The data-layer tests run against a real database rather than a mock,
    # matching local dev. Since the Postgres migration this is postgres:18 --
    # the same major the compose service and production run, because a schema
    # that only ever gets applied on one major is a schema nobody has tested.
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: parsian_store
          POSTGRES_USER: parsianstore
          POSTGRES_PASSWORD: parsianstore
        options: >-
          --health-cmd "pg_isready -U parsianstore -d parsian_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # apps/api/src/config/env.ts requires JWT_ACCESS_SECRET and
      # JWT_REFRESH_SECRET with no default -- a hardcoded fallback secret in
      # source is the vulnerability that rule exists to prevent. Locally they
      # come from the gitignored apps/api/.env, which CI does not have, so the
      # env module threw at import time and every suite that touches it failed
      # before running a single test. Minted fresh per run rather than stored
      # as a repository secret: nothing here signs a token that outlives the
      # job, so there is no value to leak and no rotation to forget.
      - name: Provision test secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applies them to `parsian_store`. The test suite does NOT run against
      # this database -- it creates and migrates `parsian_store_test` itself
      # (apps/api/src/config/testDbSetup.ts), because `resetDb()` truncates
      # everything and must never be pointed at a database anyone else uses.
      # This step stays because it is the check that the migrations apply
      # cleanly to a fresh database at all.
      - name: Apply database migrations
        run: pnpm --filter api db:deploy

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
