name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-test-build:
    runs-on: ubuntu-latest
    env:
      CI: true
    # P2.S2 added Mongoose-backed tests (base plugins, db connection) that
    # run against a real MongoDB rather than a mock, matching local dev
    # (see docs/db-indexes.md). CI needs the same service dev already has.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # apps/api/src/config/env.ts requires JWT_ACCESS_SECRET and
      # JWT_REFRESH_SECRET with no default -- a hardcoded fallback secret in
      # source is the vulnerability that rule exists to prevent. Locally they
      # come from the gitignored apps/api/.env, which CI does not have, so the
      # env module threw at import time and every suite that touches it failed
      # before running a single test. Minted fresh per run rather than stored
      # as a repository secret: nothing here signs a token that outlives the
      # job, so there is no value to leak and no rotation to forget.
      - name: Provision test secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
