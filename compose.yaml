# Development infrastructure.
#
# `pnpm dev` does not call this directly -- `scripts/dev-db.mjs` checks the
# port first and only reaches for compose when nothing is answering.
#
# The host port is 5433, not 5432, deliberately: a native PostgreSQL 18 service
# is installed on this project's development machine and already holds 5432.
# Only one process can bind a port, so the container takes the next one. Inside
# the compose network the service is reachable as `postgres:5432` regardless --
# the mapping below exists for host tools (psql, Prisma Migrate, Studio) only.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: parsian_store
      POSTGRES_USER: parsianstore
      # Development-only credential, bound to a loopback-published port. The
      # deployed database's password comes from the environment and never
      # enters git -- see compose.prod.yaml.
      POSTGRES_PASSWORD: parsianstore
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: the 18+
      # images store data under a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so `pg_upgrade --link` can work across
      # a single mount point. Mounting the old 17-and-earlier path makes the
      # container refuse to start. https://github.com/docker-library/postgres/pull/1259
      - parsianstore-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsianstore -d parsian_store"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  parsianstore-postgres:
